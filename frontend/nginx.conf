server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routes (/edge)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # This nginx image's mime.types has no .mjs entry; module workers are
    # rejected unless served with a JavaScript content type.
    location = /assets/maplibre-gl-worker.mjs {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    # API proxy to the backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
